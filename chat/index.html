<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111111">
<title>Atendimento | DG Web Solutions</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --cor: #16a34a; --fundo: #f3f4f6; --bolha: #fff; --minha: #dcfce7; --texto: #111827; --suave: #6b7280; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: Inter, system-ui, sans-serif; background: var(--fundo); color: var(--texto); display: flex; flex-direction: column; }
  header { background: #111; color: #fff; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
  .av { width: 40px; height: 40px; border-radius: 50%; background: var(--cor); display: grid; place-items: center; font-weight: 800; }
  header b { display: block; } header small { color: #9ca3af; }
  #lista { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
  .m { max-width: 85%; padding: 10px 14px; border-radius: 16px; background: var(--bolha); box-shadow: 0 1px 3px rgba(0,0,0,.08); white-space: pre-wrap; word-wrap: break-word; line-height: 1.45; font-size: 15px; }
  .m.cliente { align-self: flex-end; background: var(--minha); border-bottom-right-radius: 4px; }
  .m.ia, .m.humano { align-self: flex-start; border-bottom-left-radius: 4px; }
  .m img.anexo { display: block; max-width: 220px; border-radius: 10px; margin-top: 6px; }
  .m a.botao, .m button { display: inline-block; margin-top: 10px; background: var(--cor); color: #fff; padding: 10px 16px; border-radius: 999px; text-decoration: none; border: 0; font: inherit; font-weight: 600; cursor: pointer; }
  .pix img { display: block; width: 200px; margin: 10px 0; }
  .pix code { display: block; font-size: 11px; background: #f3f4f6; padding: 8px; border-radius: 8px; word-break: break-all; max-height: 80px; overflow: auto; }
  .digitando { color: var(--suave); font-size: 14px; align-self: flex-start; }
  form { display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid #e5e7eb; max-width: 760px; width: 100%; margin: 0 auto; align-items: flex-end; }
  textarea { flex: 1; resize: none; border: 1px solid #d1d5db; border-radius: 20px; padding: 10px 14px; font: inherit; max-height: 120px; }
  .ib { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--cor); color: #fff; font-size: 20px; cursor: pointer; flex: none; }
  .ib.foto { background: #e5e7eb; color: #111; }
  #prev { display: flex; gap: 6px; padding: 0 12px; max-width: 760px; width: 100%; margin: 0 auto; flex-wrap: wrap; }
  #prev img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
  .aviso { text-align: center; color: var(--suave); font-size: 12px; padding: 4px 16px 8px; }
</style>
</head>
<body>
<header><div class="av">DG</div><div><b>DG Web Solutions</b><small id="status">Assistente virtual · responde na hora</small></div></header>
<div id="lista"></div>
<div id="prev"></div>
<form id="f">
  <input type="file" id="arq" accept="image/*" multiple hidden>
  <button type="button" class="ib foto" id="bfoto" title="Enviar fotos">📷</button>
  <textarea id="txt" rows="1" placeholder="Escreva sua mensagem..." maxlength="1500"></textarea>
  <button class="ib" title="Enviar">➤</button>
</form>
<div class="aviso">Atendimento feito por assistente virtual com supervisão humana.</div>
<script>
const API = 'https://leilani-gressorial-loise.ngrok-free.dev/webhook/chat-site';
const q = new URLSearchParams(location.search);
const NICHO = q.get('n') || '';
const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const ler = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const URL_T = (q.get('t') || '').replace(/[^a-z0-9]/gi, '');
// se o token do link já virou outro na 1ª conversa, usa o salvo (senão recarregar perde o histórico)
let TOKEN = (URL_T && ler('dg_map_' + URL_T)) || URL_T || ler('dg_chat_t');
const lista = document.getElementById('lista');
let fotos = [];

const BOAS_VINDAS = 'Olá! Que bom que você gostou do exemplo. 😊\n\n' +
  'Eu monto uma prévia gratuita do site do SEU negócio, com o seu nome, seus serviços e suas fotos, para você ver antes de decidir qualquer coisa.\n\n' +
  'Para começar, me conta:\n' +
  '1. Nome do negócio e cidade\n' +
  '2. Principais serviços (até 6)\n' +
  '3. WhatsApp e horário de atendimento\n' +
  '4. Se puder, mande 2 ou 3 fotos do local ou do seu trabalho (botão 📷)\n\n' +
  'O site completo custa R$ 800 no Pix (ou R$ 900 no cartão em até 12x). Também dá para incluir um assistente virtual no site, que tira dúvidas dos seus clientes 24h, por R$ 150 de instalação + R$ 39/mês.';

function bolha(m) {
  const d = document.createElement('div');
  d.className = 'm ' + (m.autor || 'ia');
  d.textContent = m.texto || '';
  (m.anexos || []).forEach(u => { const i = document.createElement('img'); i.className = 'anexo'; i.src = u; i.alt = 'foto enviada'; d.appendChild(i); });
  if (m.link) { const a = document.createElement('a'); a.className = 'botao'; a.href = m.link; a.target = '_blank'; a.rel = 'noopener'; a.textContent = m.link_texto || 'Abrir'; d.appendChild(a); }
  if (m.pix && m.pix.copia) {
    const p = document.createElement('div'); p.className = 'pix';
    if (m.pix.qr_base64) { const i = document.createElement('img'); i.src = 'data:image/png;base64,' + m.pix.qr_base64; i.alt = 'QR Code Pix'; p.appendChild(i); }
    const c = document.createElement('code'); c.textContent = m.pix.copia; p.appendChild(c);
    const b = document.createElement('button'); b.type = 'button'; b.textContent = 'Copiar código Pix';
    b.onclick = () => { navigator.clipboard.writeText(m.pix.copia).then(() => { b.textContent = 'Copiado!'; }); };
    p.appendChild(b); d.appendChild(p);
  }
  lista.appendChild(d);
  lista.scrollTop = lista.scrollHeight;
}

async function chamar(corpo) {
  const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' }, body: JSON.stringify(Object.assign({ t: TOKEN, n: NICHO }, corpo)) });
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const j = await r.json();
  if (j.t && j.t !== TOKEN) { TOKEN = j.t; guardar('dg_chat_t', TOKEN); if (URL_T) guardar('dg_map_' + URL_T, TOKEN); }
  return j;
}

async function iniciar() {
  bolha({ autor: 'ia', texto: BOAS_VINDAS });
  if (!TOKEN) return;
  try {
    const j = await chamar({ acao: 'historico' });
    (j.mensagens || []).forEach(bolha);
  } catch (e) { /* sem conexão: segue só com a boas-vindas */ }
}

function reduzir(file) {
  return new Promise((ok, erro) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1280; let w = img.width, h = img.height;
      if (w > max || h > max) { const k = max / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url); ok(c.toDataURL('image/jpeg', 0.8));
    };
    img.onerror = erro; img.src = url;
  });
}

document.getElementById('bfoto').onclick = () => document.getElementById('arq').click();
document.getElementById('arq').onchange = async (e) => {
  for (const f of Array.from(e.target.files).slice(0, 4 - fotos.length)) { try { fotos.push(await reduzir(f)); } catch (x) {} }
  const p = document.getElementById('prev'); p.innerHTML = '';
  fotos.forEach(s => { const i = document.createElement('img'); i.src = s; p.appendChild(i); });
  e.target.value = '';
};

const txt = document.getElementById('txt');
txt.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); document.getElementById('f').requestSubmit(); } });
let ocupado = false;
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const texto = txt.value.trim();
  if ((!texto && !fotos.length) || ocupado) return;
  ocupado = true;
  bolha({ autor: 'cliente', texto, anexos: fotos });
  const envio = fotos; fotos = []; txt.value = ''; document.getElementById('prev').innerHTML = '';
  const dig = document.createElement('div'); dig.className = 'digitando'; dig.textContent = 'digitando...'; lista.appendChild(dig);
  try {
    const j = await chamar({ acao: 'mensagem', texto, imagens: envio });
    dig.remove();
    (j.mensagens || []).forEach(bolha);
    if (j.erro) bolha({ autor: 'ia', texto: j.erro });
  } catch (x) {
    dig.remove();
    bolha({ autor: 'ia', texto: 'Estou com instabilidade agora. Tente de novo em alguns minutos ou chame no WhatsApp.' });
  }
  ocupado = false;
};
iniciar();
</script>
</body>
</html>
