<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Projeto de exemplo | DG Web Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --cor: #0f766e; --cor2: #14b8a6; --fundo: #f7faf9; --texto: #12201e; --suave: #5b6b68; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--texto); background: var(--fundo); line-height: 1.55; padding-bottom: 96px; }
  .faixa { background: #111; color: #fff; text-align: center; font-size: 13px; padding: 8px 16px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 18px 6vw; }
  .logo { font-weight: 800; font-size: 20px; color: var(--cor); }
  .btn { display: inline-block; background: var(--cor); color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 999px; font-weight: 600; border: 0; cursor: pointer; }
  .btn.claro { background: #fff; color: var(--cor); }
  .hero { padding: 70px 6vw 80px; background: linear-gradient(135deg, var(--cor), var(--cor2)); color: #fff; border-radius: 0 0 32px 32px; }
  .hero h1 { font-size: clamp(30px, 5vw, 52px); line-height: 1.1; max-width: 760px; }
  .hero p { margin: 18px 0 28px; max-width: 600px; font-size: 18px; opacity: .92; }
  section { padding: 64px 6vw; }
  h2 { font-size: 30px; margin-bottom: 26px; }
  .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
  .card { background: #fff; border-radius: 18px; padding: 24px; box-shadow: 0 4px 18px rgba(0,0,0,.06); }
  .card .ic { font-size: 30px; }
  .card h3 { margin: 10px 0 6px; font-size: 18px; }
  .card p { color: var(--suave); font-size: 15px; }
  .sobre { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; align-items: center; }
  .foto { min-height: 260px; border-radius: 22px; background: linear-gradient(160deg, var(--cor2), var(--cor)); display: grid; place-items: center; color: #fff; font-size: 80px; }
  .dep { font-style: italic; }
  .dep b { display: block; font-style: normal; margin-top: 10px; color: var(--cor); }
  .info { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
  .mapa { height: 220px; border-radius: 18px; background: repeating-linear-gradient(45deg, #e3ece9, #e3ece9 12px, #eef4f2 12px, #eef4f2 24px); display: grid; place-items: center; color: var(--suave); }
  footer { text-align: center; color: var(--suave); font-size: 14px; padding: 30px 6vw; }
  .zap { position: fixed; right: 18px; bottom: 100px; width: 56px; height: 56px; border-radius: 50%; background: #25d366; color: #fff; display: grid; place-items: center; font-size: 28px; box-shadow: 0 6px 18px rgba(0,0,0,.2); text-decoration: none; }
  .cta { position: fixed; left: 0; right: 0; bottom: 0; background: #111; color: #fff; padding: 14px 6vw; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; z-index: 9; }
  .cta span { font-size: 15px; }
  .cta .btn { background: #22c55e; }
  @media (max-width: 600px) { .cta { justify-content: center; text-align: center; } header .btn { display: none; } }
</style>
</head>
<body>
<div class="faixa">Projeto de exemplo criado pela DG Web Solutions: nomes e dados são fictícios.</div>
<header><div class="logo" id="logo"></div><a class="btn" href="#contato">Agendar</a></header>
<div class="hero">
  <h1 id="titulo"></h1>
  <p id="sub"></p>
  <a class="btn claro" href="#contato">Falar no WhatsApp</a>
</div>
<section><h2>Serviços</h2><div class="grade" id="servicos"></div></section>
<section class="sobre">
  <div class="foto" id="foto"></div>
  <div><h2>Sobre nós</h2><p id="sobre"></p></div>
</section>
<section><h2>O que dizem nossos clientes</h2><div class="grade" id="deps"></div></section>
<section id="contato"><h2>Onde estamos</h2>
  <div class="info">
    <div class="card"><h3>Endereço</h3><p id="end"></p></div>
    <div class="card"><h3>Horário</h3><p id="hora"></p></div>
    <div class="mapa">Mapa do Google aqui</div>
  </div>
</section>
<footer id="rodape"></footer>
<a class="zap" href="#contato" title="WhatsApp (exemplo)">✆</a>
<div class="cta"><span>Gostou? Seu negócio pode ter um site assim em poucos dias.</span><a class="btn" id="irchat" href="../chat/">Quero um site assim</a></div>
<script>
const NICHOS = {
  dentista: {
    cor: ['#0e7490', '#22d3ee'], icone: '🦷', nome: 'Sorriso Pleno Odontologia',
    titulo: 'Seu sorriso merece cuidado de verdade', sub: 'Consultório moderno, atendimento sem pressa e planos que cabem no seu bolso.',
    servicos: [['🪥', 'Limpeza e prevenção', 'Consultas de rotina para manter a saúde bucal em dia.'], ['✨', 'Clareamento', 'Dentes mais brancos com técnica segura e acompanhada.'], ['🦷', 'Implantes', 'Recupere a mastigação e a confiança para sorrir.'], ['😁', 'Ortodontia', 'Aparelhos fixos e alinhadores transparentes.'], ['🩺', 'Tratamento de canal', 'Procedimento com anestesia e conforto.'], ['👶', 'Odontopediatria', 'Atendimento lúdico e acolhedor para crianças.']],
    sobre: 'Há mais de 10 anos cuidando de sorrisos no bairro. Nossa equipe explica cada etapa do tratamento e combina com você o melhor plano.',
    deps: [['Fui muito bem atendida, explicaram tudo com calma.', 'Mariana S.'], ['Fiz o clareamento e amei o resultado!', 'Rafael T.'], ['Meu filho perdeu o medo de dentista aqui.', 'Juliana P.']],
    end: 'Rua das Flores, 123 - Centro', hora: 'Seg a sex, 8h às 19h · Sáb, 8h às 12h'
  },
  advogado: {
    cor: ['#1e293b', '#b45309'], icone: '⚖️', nome: 'Almeida & Rocha Advocacia',
    titulo: 'Orientação jurídica clara, do primeiro contato à solução', sub: 'Atendimento próximo, linguagem simples e acompanhamento de cada etapa do seu caso.',
    servicos: [['👨‍👩‍👧', 'Direito de Família', 'Divórcio, pensão, guarda e inventário.'], ['💼', 'Direito Trabalhista', 'Rescisões, verbas e acordos.'], ['🏠', 'Direito Imobiliário', 'Contratos, usucapião e regularização.'], ['🛒', 'Direito do Consumidor', 'Cobranças indevidas e negativação.'], ['📄', 'Contratos', 'Elaboração e revisão de contratos.'], ['🧓', 'Previdenciário', 'Aposentadorias e benefícios do INSS.']],
    sobre: 'Escritório com atuação consultiva e contenciosa. Acreditamos que cliente bem informado decide melhor, por isso explicamos cada passo.',
    deps: [['Resolveram meu caso com rapidez e sempre me deram retorno.', 'Carlos M.'], ['Atendimento humano, me senti segura.', 'Fernanda L.'], ['Explicaram tudo sem juridiquês.', 'Paulo R.']],
    end: 'Av. Brasil, 900, sala 54 - Centro', hora: 'Seg a sex, 9h às 18h'
  },
  estetica: {
    cor: ['#9d174d', '#f472b6'], icone: '🌸', nome: 'Clínica Lumina Estética',
    titulo: 'Realce sua beleza com segurança e resultados naturais', sub: 'Protocolos personalizados, profissionais especializados e ambiente acolhedor.',
    servicos: [['💆', 'Limpeza de pele', 'Pele renovada, sem impurezas e mais luminosa.'], ['💉', 'Harmonização facial', 'Resultados naturais, planejados para você.'], ['✨', 'Botox', 'Suavize linhas de expressão com segurança.'], ['🔆', 'Depilação a laser', 'Tecnologia moderna e sessões rápidas.'], ['🧖', 'Drenagem linfática', 'Menos inchaço e mais bem-estar.'], ['🌿', 'Peeling', 'Uniformiza o tom e a textura da pele.']],
    sobre: 'Cada protocolo começa com uma avaliação completa. Nosso compromisso é com resultados naturais e com a sua saúde.',
    deps: [['Minha pele nunca esteve tão bonita!', 'Aline C.'], ['Ambiente lindo e atendimento impecável.', 'Bianca R.'], ['Resultado super natural, recomendo.', 'Daniela F.']],
    end: 'Rua Primavera, 45 - Jardins', hora: 'Ter a sáb, 9h às 20h'
  }
};
const q = new URLSearchParams(location.search);
let n = (q.get('n') || 'dentista').toLowerCase();
if (/advog/.test(n)) n = 'advogado'; else if (/est[eé]t|beleza|clinica/.test(n)) n = 'estetica'; else if (!NICHOS[n]) n = 'dentista';
const d = NICHOS[n];
const $ = (id) => document.getElementById(id);
document.documentElement.style.setProperty('--cor', d.cor[0]);
document.documentElement.style.setProperty('--cor2', d.cor[1]);
document.title = d.nome + ' | Projeto de exemplo';
$('logo').textContent = d.nome; $('titulo').textContent = d.titulo; $('sub').textContent = d.sub;
$('foto').textContent = d.icone; $('sobre').textContent = d.sobre; $('end').textContent = d.end; $('hora').textContent = d.hora;
$('rodape').textContent = '© ' + d.nome + ' · exemplo de site feito pela DG Web Solutions';
const card = (ic, t, p) => { const c = document.createElement('div'); c.className = 'card'; c.innerHTML = '<div class="ic"></div><h3></h3><p></p>'; c.children[0].textContent = ic; c.children[1].textContent = t; c.children[2].textContent = p; return c; };
d.servicos.forEach(s => $('servicos').appendChild(card(s[0], s[1], s[2])));
d.deps.forEach(s => { const c = document.createElement('div'); c.className = 'card dep'; c.textContent = '“' + s[0] + '”'; const b = document.createElement('b'); b.textContent = s[1]; c.appendChild(b); $('deps').appendChild(c); });
const t = q.get('t') || '';
$('irchat').href = '../chat/?n=' + n + (t ? '&t=' + encodeURIComponent(t) : '');
</script>
</body>
</html>
