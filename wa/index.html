<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fila do WhatsApp</title>
<style>
  :root { --fundo: #f3f4f6; --texto: #111827; --card: #fff; }
  @media (prefers-color-scheme: dark) { :root { --fundo: #111827; --texto: #f3f4f6; --card: #1f2937; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: var(--fundo); color: var(--texto); padding: 16px; box-sizing: border-box; }
  .c { background: var(--card); border-radius: 18px; padding: 28px 24px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 6px 24px rgba(0,0,0,.12); }
  .i { font-size: 44px; } p { font-size: 17px; line-height: 1.5; }
</style>
</head>
<body>
<div class="c"><div class="i" id="i">⏳</div><p id="m">Registrando...</p></div>
<script>
const q = new URLSearchParams(location.search);
const m = document.getElementById('m'), i = document.getElementById('i');
fetch('https://leilani-gressorial-loise.ngrok-free.dev/webhook/wa-acao', {
  method: 'POST', headers: { 'Content-Type': 'application/json', 'ngrok-skip-browser-warning': '1' },
  body: JSON.stringify({ l: q.get('l') || '', a: q.get('a') || '', k: q.get('k') || '' })
}).then(r => r.json()).then(j => { i.textContent = j.ok ? '✅' : '⚠️'; m.textContent = j.msg || 'Pronto.'; })
  .catch(() => { i.textContent = '⚠️'; m.textContent = 'Não consegui falar com o sistema (o PC/n8n/ngrok está ligado?). Tente de novo em instantes.'; });
</script>
</body>
</html>
